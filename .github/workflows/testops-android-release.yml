name: TestOps Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

concurrency:
  group: testops-android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  TESTOPS_REPOSITORY: ZMAX-A/TOP
  TESTOPS_REVISION: 17a80849da10a56273b5570517692b7568d53cfe
  PACKAGE_NAME: yanjia-android-appium
  IMAGE_REPOSITORY: local/yanjia-android-appium
  YANJIA_IGNORE_DOTENV: "true"
  TEST_USERNAME: fixture_user
  TEST_PASSWORD: fixture_password
  SEEDED_CUSTOMER_PHONE: "00000000000"
  YANJIA_MUTATION_CUSTOMER_QUERY: "00000000000"

jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out immutable Android revision
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Windows Python runtime
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install and verify hash-locked Windows dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\install-runtime.ps1 -Python (Get-Command python).Source `
            -EnvironmentPath "$env:RUNNER_TEMP\android-runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime installation failed.' }
          $runtimePython = "$env:RUNNER_TEMP\android-runtime\Scripts\python.exe"
          & $runtimePython -I scripts/runtime_dependencies.py `
            --output "$env:RUNNER_TEMP\testops-runtime-evidence\runtime-inventory.json" `
            --source-revision "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime inventory failed.' }
          Copy-Item config/runtime-requirements.lock "$env:RUNNER_TEMP\testops-runtime-evidence\runtime-requirements.lock"

      - name: Test the exact Windows runtime without device access
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\android-runtime\Scripts\python.exe" -m pytest tests/unit -q
          if ($LASTEXITCODE -ne 0) { throw 'Locked Windows unit tests failed.' }

      - name: Generate SPDX SBOM from installed Windows packages
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ${{ runner.temp }}/android-runtime/Lib/site-packages
          syft-version: v1.42.3
          format: spdx-json
          output-file: ${{ runner.temp }}/testops-runtime-evidence/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Transfer runtime evidence to the signing job
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/testops-runtime-evidence/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: windows-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out immutable Android tag
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned TestOps Android adapter
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.TESTOPS_REPOSITORY }}
          ref: ${{ env.TESTOPS_REVISION }}
          path: .testops-platform
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate immutable release coordinates
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"unsupported release tag: {tag}")
          version = tag.removeprefix("v")
          manifest = json.loads(Path("testops-package.json").read_text("utf-8"))
          project = tomllib.loads(Path("pyproject.toml").read_text("utf-8"))["project"]
          if manifest.get("name") != os.environ["PACKAGE_NAME"]:
              raise SystemExit("testops-package.json name does not match PACKAGE_NAME")
          if manifest.get("version") != version or project.get("version") != version:
              raise SystemExit("Git tag, package manifest and pyproject versions must match")
          PY

      - name: Install release dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check "pydantic>=2.10,<3"

      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .

      - name: Run Pyright
        shell: bash
        run: |
          set -euo pipefail
          python -m pyright --pythonpath "$(command -v python)"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/unit -q

      - name: Validate Excel catalog and Android coverage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_excel.py test_case.xlsx
          python scripts/report_android_coverage.py --source step_sheet --fail-on-p0-backlog

      - name: Export allowlisted Android package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/testops-release"
          bundle_root="${release_root}/bundle"
          rm -rf -- "${release_root}"
          mkdir -p "${bundle_root}/android" "${bundle_root}/adapter"
          digest="$(PYTHONPATH=".testops-platform/packages/contracts/src:.testops-platform/runners/android_appium/src" \
            python .testops-platform/scripts/package_android_appium.py \
              --source . \
              --adapter-root .testops-platform/runners/android_appium/src \
              --export-to "${bundle_root}/android" | tail -n 1)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          cp -R .testops-platform/runners/android_appium/src/. "${bundle_root}/adapter/"
          exported_digest="$(python .testops-platform/scripts/package_android_appium.py \
            --source "${bundle_root}/android" \
            --adapter-root "${bundle_root}/adapter" | tail -n 1)"
          [[ "${exported_digest}" == "${digest}" ]]
          printf '%s\n' "${digest}" > "${release_root}/package-source-digest.txt"
          printf '%s\n' "${TESTOPS_REVISION}" > "${release_root}/testops-adapter-revision.txt"
          artifact="${release_root}/${PACKAGE_NAME}-${GITHUB_REF_NAME#v}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "${release_root}/package.tar" -C "${bundle_root}" .
          gzip -n "${release_root}/package.tar"
          mv "${release_root}/package.tar.gz" "${artifact}"
          artifact_digest="sha256:$(sha256sum "${artifact}" | cut -d' ' -f1)"
          echo "release_root=${release_root}" >> "${GITHUB_OUTPUT}"
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"
          echo "artifact_digest=${artifact_digest}" >> "${GITHUB_OUTPUT}"
          echo "package_digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Download evidence from the exact Windows runtime
        uses: actions/download-artifact@v4.3.0
        with:
          name: android-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/testops-release

      - name: Scan every SBOM dependency and retain all severity levels
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: sbom
          scan-ref: ${{ runner.temp }}/testops-release/sbom.spdx.json
          format: json
          output: ${{ runner.temp }}/testops-release/trivy-vulnerability-report.json
          list-all-pkgs: "true"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Reject missing dependency coverage and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          release_root="${{ steps.package.outputs.release_root }}"
          cmp config/runtime-requirements.lock "${release_root}/runtime-requirements.lock"
          python scripts/verify_release_evidence.py \
            --lock "${release_root}/runtime-requirements.lock" \
            --inventory "${release_root}/runtime-inventory.json" \
            --sbom "${release_root}/sbom.spdx.json" \
            --scan "${release_root}/trivy-vulnerability-report.json" \
            --source-revision "${GITHUB_SHA}" \
            --output "${release_root}/dependency-coverage.json"

      - name: Build provenance statement
        env:
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact_digest }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.package_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release_root = Path(os.environ["RUNNER_TEMP"]) / "testops-release"
          artifact = next(release_root.glob("yanjia-android-appium-*.tar.gz"))
          statement = {
              "_type": "https://in-toto.io/Statement/v1",
              "subject": [{
                  "name": artifact.name,
                  "digest": {"sha256": os.environ["ARTIFACT_DIGEST"].removeprefix("sha256:")},
              }],
              "predicateType": "https://slsa.dev/provenance/v1",
              "predicate": {
                  "buildDefinition": {
                      "buildType": "https://github.com/ZMAX-A/APP/testops-android-package/v1",
                      "externalParameters": {
                          "source": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
                          "ref": os.environ["GITHUB_REF"],
                          "testops_revision": os.environ["TESTOPS_REVISION"],
                      },
                      "resolvedDependencies": [{
                          "uri": f"git+https://github.com/{os.environ['GITHUB_REPOSITORY']}@{os.environ['GITHUB_SHA']}",
                          "digest": {"gitCommit": os.environ["GITHUB_SHA"]},
                      }, {
                          "uri": f"git+https://github.com/{os.environ['TESTOPS_REPOSITORY']}@{os.environ['TESTOPS_REVISION']}",
                          "digest": {"gitCommit": os.environ["TESTOPS_REVISION"]},
                      }],
                  },
                  "runDetails": {
                      "builder": {
                          "id": (
                              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                              f"{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
                          )
                      },
                      "metadata": {"invocationId": os.environ["GITHUB_RUN_ID"]},
                  },
                  "packageSourceDigest": os.environ["PACKAGE_DIGEST"],
                  "runtimeDependencies": {
                      "platform": "win32",
                      "python": "3.12",
                      "lockDigest": "sha256:" + hashlib.sha256(
                          (release_root / "runtime-requirements.lock").read_bytes()
                      ).hexdigest(),
                      "inventoryDigest": "sha256:" + hashlib.sha256(
                          (release_root / "runtime-inventory.json").read_bytes()
                      ).hexdigest(),
                      "coverageDigest": "sha256:" + hashlib.sha256(
                          (release_root / "dependency-coverage.json").read_bytes()
                      ).hexdigest(),
                  },
              },
          }
          output = release_root / "provenance.intoto.json"
          output.write_text(json.dumps(statement, sort_keys=True, separators=(",", ":")), "utf-8")
          PY

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign release evidence with GitHub OIDC
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          release_root="${{ steps.package.outputs.release_root }}"
          cosign sign-blob --yes --bundle "${release_root}/package.sigstore-bundle.json" \
            "${{ steps.package.outputs.artifact }}"
          cosign sign-blob --yes --bundle "${release_root}/provenance.sigstore-bundle.json" \
            "${release_root}/provenance.intoto.json"
          cosign sign-blob --yes --bundle "${release_root}/sbom.sigstore-bundle.json" \
            "${release_root}/sbom.spdx.json"
          cosign sign-blob --yes --bundle "${release_root}/vulnerability-report.sigstore-bundle.json" \
            "${release_root}/trivy-vulnerability-report.json"

      - name: Build signed release manifest
        if: github.event_name == 'push'
        env:
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact_digest }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.package_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "testops-release"
          def digest(name: str) -> str:
              return "sha256:" + hashlib.sha256((root / name).read_bytes()).hexdigest()

          document = {
              "schema_version": "1.0",
              "automation_package": {
                  "name": os.environ["PACKAGE_NAME"],
                  "version": os.environ["GITHUB_REF_NAME"].removeprefix("v"),
                  "runner_type": "ANDROID_APPIUM",
                  "image_repository": os.environ["IMAGE_REPOSITORY"],
                  "digest": os.environ["PACKAGE_DIGEST"],
              },
              "source": {
                  "repository": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
                  "tag": os.environ["GITHUB_REF_NAME"],
                  "revision": os.environ["GITHUB_SHA"],
                  "workflow_identity": (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/.github/workflows/"
                      f"testops-android-release.yml@refs/tags/{os.environ['GITHUB_REF_NAME']}"
                  ),
                  "builder_id": (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
                  ),
              },
              "evidence": {
                  "artifact_digest": os.environ["ARTIFACT_DIGEST"],
                  "signature_bundle_digest": digest("package.sigstore-bundle.json"),
                  "provenance_digest": digest("provenance.intoto.json"),
                  "sbom_digest": digest("sbom.spdx.json"),
                  "vulnerability_report_digest": digest("trivy-vulnerability-report.json"),
                  "runtime_lock_digest": digest("runtime-requirements.lock"),
                  "runtime_inventory_digest": digest("runtime-inventory.json"),
                  "dependency_coverage_digest": digest("dependency-coverage.json"),
              },
          }
          (root / "testops-android-release.json").write_text(
              json.dumps(document, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              "utf-8",
          )
          PY

      - name: Create immutable GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_root="${{ steps.package.outputs.release_root }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          assets=(
            "${release_root}/${PACKAGE_NAME}-${GITHUB_REF_NAME#v}.tar.gz"
            "${release_root}/package-source-digest.txt"
            "${release_root}/testops-adapter-revision.txt"
            "${release_root}/sbom.spdx.json"
            "${release_root}/trivy-vulnerability-report.json"
            "${release_root}/provenance.intoto.json"
            "${release_root}/package.sigstore-bundle.json"
            "${release_root}/provenance.sigstore-bundle.json"
            "${release_root}/sbom.sigstore-bundle.json"
            "${release_root}/vulnerability-report.sigstore-bundle.json"
            "${release_root}/testops-android-release.json"
            "${release_root}/runtime-requirements.lock"
            "${release_root}/runtime-inventory.json"
            "${release_root}/dependency-coverage.json"
          )
          for asset in "${assets[@]}"; do
            [[ -f "${asset}" ]] || { echo "Missing release asset: ${asset}" >&2; exit 1; }
          done
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --title "YanJia Android ${GITHUB_REF_NAME}" \
            --notes "Immutable TestOps Android package, signed provenance, SBOM and vulnerability evidence."
